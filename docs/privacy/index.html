so. Cloud collector in eu-west-2.</p><p>The newsletter follows <a href=https://www.beehiiv.com/privacy target=_blank rel="noopener noreferrer">https://www.beehiiv.com/privacy</a>.</p></article></div><div id=feed-sentinel aria-hidden=true></div><script type=module>
  const feed = document.getElementById("post-feed");
  const sentinel = document.getElementById("feed-sentinel");
  let loading = false;

  function runScripts(root) {
    for (const old of root.querySelectorAll("script")) {
      const s = document.createElement("script");
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  }

  async function loadNext() {
    const tail = feed.lastElementChild;
    const url = tail && tail.dataset.next;
    if (loading || !url) { if (!url) loader.disconnect(); return; }
    loading = true;
    try {
      const res = await fetch(url);
      if (!res.ok) throw 0;
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const unit = doc.querySelector(".post-unit");
      if (!unit) throw 0;
      const imported = document.importNode(unit, true);
      feed.appendChild(imported);
      const prev = tail.querySelector(".post-next");
      if (prev) prev.remove();
      runScripts(imported);
    } catch { loader.disconnect(); }
    loading = false;
  }

  const loader = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) loadNext();
  }, { rootMargin: "800px" });
  addEventListener("scroll", () => loader.observe(sentinel), { once: true, passive: true });
