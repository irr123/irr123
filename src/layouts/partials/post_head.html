<div class="post-meta">
  {{ partial "breadcrumbs.html" . }}
  {{ if not .Date.IsZero }}
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">
    {{ .Date | time.Format site.Params.theme_config.date_format }}
  </time>
  {{ end }}
</div>

<header><h1><span class="post-title">{{ .Title }}</span></h1></header>
