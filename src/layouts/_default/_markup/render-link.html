{{- $u := urls.Parse .Destination -}}
{{- $dest := .Destination -}}
{{- if hasPrefix $dest "#" -}}{{- $dest = printf "%s%s" .Page.RelPermalink $dest -}}{{- end -}}
<a
  href="{{ $dest }}"
  {{-
  with
  .Title
  }}
  title="{{ . }}"
  data-pagefind-index-attrs="title"
  {{
  end
  -}}
  {{-
  if
  $u.IsAbs
  }}
  target="_blank"
  rel="noopener noreferrer"
  {{
  end
  -}}
>
  {{- with .Text }}{{ . }}{{ end -}}
</a>
{{- /* https://gohugo.io/render-hooks/links/ */ -}}
